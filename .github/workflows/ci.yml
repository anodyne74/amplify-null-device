name: CI/CD Pipeline

on:
  push:
    branches: [main, 1-delivery-management]
  pull_request:
    branches: [main, 1-delivery-management]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        # npm ci currently fails on this repo's dependency tree (aws-cdk-lib's large,
        # deeply-nested graph appears to trigger a known npm lockfileVersion 3 writer
        # edge case: npm install succeeds and writes a lockfile that npm ci — even
        # the same npm version — then rejects as incomplete for a shifting set of
        # deep transitive packages). Reproduced independently of any app code change,
        # confirmed on GitHub Actions' own runners as well as locally across multiple
        # npm versions. npm install is slightly less strict about lockfile-exactness
        # but has installed reliably every time in testing.
        run: npm install

      - name: Generate Amplify config
        run: npm run generate:config

      - name: Validate Amplify outputs
        run: npm run validate:amplify-outputs
      
      - name: TypeScript type checking
        run: npm run typecheck
      
      - name: ESLint
        run: npm run lint

      - name: Build project
        run: npm run build
      
      - name: Run tests with coverage
        run: npm run test:ci
      
      - name: Security audit (informational)
        run: |
          npm audit --omit=dev --audit-level=high || \
          echo "::warning title=Security audit::Vulnerabilities detected by npm audit (non-blocking for this pipeline)."
