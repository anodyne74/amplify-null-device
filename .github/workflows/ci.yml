name: CI/CD Pipeline

on:
  push:
    branches: [main, development, 1-delivery-management]
  pull_request:
    branches: [main, development, 1-delivery-management]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # One place to change it: package.json engines needs >=22, and Amplify's build
          # pins NODE_VERSION (an app environment variable) to a 22.x release.
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        # Not npm ci: npm install writes a lockfile that npm ci then rejects (verified on
        # npm 9, 10 and 11). npm drops the bundled @opentelemetry/core entries nested under
        # @aws-amplify/data-construct and graphql-api-construct, and npm ci reports the gap
        # as "lock file's semver@x does not satisfy semver@y". A lockfile written by
        # npm install --package-lock-only does pass npm ci, but the next npm install (any
        # developer's, or Dependabot's) rewrites it. So the lockfile is kept in the shape
        # npm install leaves it, which a second npm install leaves unchanged.
        run: npm install

      - name: Generate Amplify config
        run: npm run generate:config

      - name: Validate Amplify outputs
        run: npm run validate:amplify-outputs
      
      - name: TypeScript type checking
        run: npm run typecheck
      
      - name: ESLint
        run: npm run lint

      - name: Build project
        run: npm run build
      
      - name: Run tests with coverage
        run: npm run test:ci
      
      - name: Security audit (informational)
        run: |
          npm audit --omit=dev --audit-level=high || \
          echo "::warning title=Security audit::Vulnerabilities detected by npm audit (non-blocking for this pipeline)."
