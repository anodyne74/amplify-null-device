version: 1
backend:
  phases:
    build:
      commands:
        - npm install --cache .npm --prefer-offline
        - npm run preflight:ampx
        - npx ampx pipeline-deploy --app-id "$AWS_APP_ID" --branch "$AWS_BRANCH"
        - node scripts/ensure-cognito-groups.js
        - node scripts/ensure-ses-active-ruleset.js
frontend:
  phases:
    preBuild:
      commands:
        - npm install --cache .npm --prefer-offline
        - "[ -f amplify_outputs.json ] || npm run generate:config"
        # Validate the amplify_outputs.json generated by backend deployment.
        - npm run validate:amplify-outputs
    build:
      commands:
        # Amplify hands its environment variables to the build, not to the SSR
        # runtime; writing one to .env.production is how it reaches API routes.
        # SMS_TEST_NUMBERS: the mobiles a non-production branch may text
        # (Notify Operator, ADR 0010). Kept out of amplify_outputs.json, which
        # browsers download.
        - '[ -z "$SMS_TEST_NUMBERS" ] || echo "SMS_TEST_NUMBERS=$SMS_TEST_NUMBERS" >> .env.production'
        # GOOGLE_ROUTES_API_KEY: server-only key restricted to the Routes API,
        # for Route Estimates (scripts/setup-routes-api-key.sh).
        - '[ -z "$GOOGLE_ROUTES_API_KEY" ] || echo "GOOGLE_ROUTES_API_KEY=$GOOGLE_ROUTES_API_KEY" >> .env.production'
        # Build frontend (quality checks already passed in GitHub Actions)
        - npm run build
  artifacts:
    # Next Web Compute output is served from `.next`
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*